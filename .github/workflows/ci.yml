name: CI (web)

# Valida la landing en cada PR: lint + typecheck + build.
# Ningún cambio roto debería mergearse sin pasar esto.
on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # `next build` runs linting + type validity internally, so no separate
      # lint step (standalone `next lint` is deprecated and needs ESLint setup).
      - name: Build
        run: npm run build
