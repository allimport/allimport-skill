name: Deploy web to GitHub Pages

on:
  push:
    branches:
      - claude/allimport-skill-setup-0m43zg
  workflow_dispatch:

# gh-pages branch deploy (not the Pages artifact API): creating the branch
# auto-enables Pages serving from it, and this repo's GITHUB_TOKEN cannot
# create a Pages site via the API ("Resource not accessible by integration",
# see run 29161085736). Branch mode needs only contents: write.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /allimport-skill
      # _next/ starts with an underscore; without .nojekyll, Jekyll drops it.
      - run: touch out/.nojekyll
      - name: Push out/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/out
          force_orphan: true
